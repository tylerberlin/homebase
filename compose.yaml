# Docker Compose for Homebase. On TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML.
# Fill in the CHANGE_ME values, and delete the parts for servers you don't have:
# everything server-related is optional (see "Servers" in the README).
services:
  homebase:
    image: ghcr.io/tylerberlin/homebase:latest   # built from this repo on every release (or: build: .)
    container_name: homebase
    restart: unless-stopped
    network_mode: host            # lets it read host stats, reach the TrueNAS API on localhost, and reach other machines over Tailscale
    volumes:
      - ./data:/data              # settings, countdowns, logins and alert subscriptions when Upstash isn't connected
      # - /mnt/tank/apps/minecraft/mods:/mc-mods:ro      # lists a Minecraft server's mods (read-only)
      # - /var/run/docker.sock:/var/run/docker.sock:ro   # without TrueNAS: list this machine's containers
      # - /etc/os-release:/host/etc/os-release:ro        # without TrueNAS: name the host's OS on its card
    environment:
      PORT: "8090"                # the port it listens on (host network, so this is the real port)
      REFRESH: "10"
      SESSION_SECRET: "CHANGE_ME_a_long_random_string"
      PUBLIC_HOST: "dash.example.com"   # the address you reach it on, for passkeys

      # TrueNAS API (Settings → API Keys on your user, or the top-right user menu → My API Keys)
      TRUENAS_HOST: "127.0.0.1"
      TRUENAS_API_KEY: "CHANGE_ME_truenas_api_key"

      # Optional: link the NAS card to the TrueNAS web UI (your Tailscale address)
      NAS_WEB_URL: ""

      # Weather and local time on the NAS card
      NAS_LOCATION: "New York, NY"
      NAS_LAT: "40.71"
      NAS_LON: "-74.01"

      # Optional: a Minecraft server on this box (the port it listens on). Leave NAS_MC_PORT out if you don't have one.
      # Without any Minecraft server, the Minecraft tab and status simply don't show.
      NAS_MC_HOST: "127.0.0.1"
      NAS_MC_PORT: "25565"
      NAS_MC_ADDRESS: "mc.example.com"
      # NAS_MC_MODS: "/mc-mods"   # the mods folder mounted above; leave out to hide the mods list
      NAS_MC_LABEL: "Modded · Create"

      # Without TrueNAS: show this machine as a plain server card instead (and drop TRUENAS_API_KEY)
      # NAS_ENABLED: "1"

      # Other computers running agent/homebase_agent.py: "Name|url|token[|Location|lat|lon|tz]", comma-separated
      # AGENTS: "Mini PC|http://192.168.1.30:9100/stats|CHANGE_ME,Mac|http://mac.local:9100/stats|CHANGE_ME"

      # Proxmox VE (a read-only PVEAuditor API token)
      # PROXMOX_URL: "https://192.168.1.20:8006"
      # PROXMOX_TOKEN: "homebase@pve!dash=CHANGE_ME"

      # One agent machine with its own settings (older setups; AGENTS does the same)
      PI_AGENT_URL: "http://CHANGE_ME_pi_tailscale_ip:9100/stats"
      PI_AGENT_TOKEN: "CHANGE_ME_same_token_as_on_the_pi"
      # Optional: a Minecraft server on the Pi. Set MC_PORT on the agent too.
      PI_MC_PORT: "25565"
      PI_MC_LABEL: "Survival World"
      PI_MC_ADDRESS: ""

      # Optional: the Now playing card. Computers running the agent with NOW_PLAYING=1 get buttons;
      # Last.fm shows what you play anywhere else.
      # MUSIC: "Mac|http://CHANGE_ME_mac_tailscale_ip:9100|CHANGE_ME_agent_token"
      # LASTFM_USER: ""
      # LASTFM_API_KEY: ""

      # Optional: pin the push-alert signing keys (otherwise made once and kept in the store)
      # VAPID_PUBLIC_KEY: ""
      # VAPID_PRIVATE_KEY: ""

      # Public endpoints to check: "Name|URL,Name|URL"
      LINKS: "Cloud|https://cloud.example.com"
